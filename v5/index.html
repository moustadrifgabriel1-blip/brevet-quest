<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brevet Quest</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brevet Quest">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg">
<style>
/* ===== Brevet Quest v5 : système de design v4 (sobre, natif, une couleur d'accent), lecture confortable par défaut. ===== */
:root{
 --bg:#F2F2F7;--card:#FFFFFF;--card2:#F4F4F8;--ink:#111114;--ink2:#5F5F69;--ink3:#6E6E78;--line:rgba(60,60,67,.12);--line2:rgba(60,60,67,.22);
 --accent:#2F6BFF;--accent2:#1E4FD6;--on:#FFFFFF;--tint:rgba(47,107,255,.11);
 --ok:#178A4E;--okbg:rgba(23,138,78,.12);--bad:#D93F45;--badbg:rgba(217,63,69,.12);--gold:#B07400;--goldbg:rgba(240,162,27,.14);--fire:#FF6A2B;
 --fig:#111827;--field:#FFFFFF;
 --sh:0 1px 1px rgba(20,20,30,.04),0 2px 6px rgba(20,20,30,.05),0 12px 32px rgba(20,20,30,.06);--sh2:0 2px 4px rgba(20,20,30,.06),0 18px 44px rgba(20,20,30,.12);--hl:inset 0 1px 0 rgba(255,255,255,.7);
 --fb:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--fl:var(--fb);
 --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
 /* lecture : réglages du profil (taille, interligne, largeur de ligne) */
 --fs:17px;--lh:1.5;--mw:65ch;
 /* anciens noms encore utilisés par le contenu (labos, figures) */
 --panel:var(--card);--panel2:var(--card2);--muted:var(--ink2);--amber:var(--gold);--amber2:var(--gold);--cyan:var(--accent);--lock:var(--ink3);--w:var(--accent)}
@media(prefers-color-scheme:dark){:root{--bg:#000000;--card:#1C1C1E;--card2:#2A2A2E;--ink:#F2F2F5;--ink2:#A3A3AD;--ink3:#8E8E9A;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--accent:#4A7FFF;--accent2:#8FB0FF;--tint:rgba(74,127,255,.17);--ok:#3DCB7A;--okbg:rgba(61,203,122,.16);--bad:#FF6166;--badbg:rgba(255,97,102,.16);--gold:#FFB83D;--goldbg:rgba(255,184,61,.16);--field:#2A2A2E;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px rgba(0,0,0,.35);--sh2:0 1px 0 rgba(255,255,255,.06) inset,0 20px 48px rgba(0,0,0,.5);--hl:inset 0 1px 0 rgba(255,255,255,.06)}}
/* contraste renforcé (profil) */
html.hc{--ink2:#3A3A42;--ink3:#45454E;--line:rgba(0,0,0,.28);--line2:rgba(0,0,0,.45);--accent2:#1640B0}
@media(prefers-color-scheme:dark){html.hc{--ink:#FFFFFF;--ink2:#D4D4DC;--ink3:#C2C2CC;--line:rgba(255,255,255,.3);--line2:rgba(255,255,255,.5);--accent2:#B5CBFF}}
html.hc .card,html.hc .stat,html.hc .lrow,html.hc .list button{outline:1px solid var(--line2)}
html.f-serif{--fl:"New York",ui-serif,Georgia,"Times New Roman",serif}html.f-round{--fl:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em;text-wrap:balance;font-weight:700}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
a{color:var(--accent)}
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none}
#app{max-width:720px;margin:0 auto;padding:calc(8px + var(--sat)) 16px calc(96px + var(--sab))}
/* bandeau d'état */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 10px;min-height:42px}
.xp{flex:1;min-width:0}.xp .lbl{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px;min-width:0}.xp .lbl span{overflow:hidden;text-overflow:ellipsis}.xp .lbl span:first-child{color:var(--ink);flex:none}
.xp .bar,.ebar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.xp .bar i,.ebar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--card);border-radius:999px;padding:6px 11px 6px 9px;white-space:nowrap;color:var(--ink);box-shadow:var(--sh),var(--hl)}
.pill .ic{width:16px;height:16px;color:var(--gold)}.pill.fire .ic{color:var(--ink3)}.pill.fire.lit .ic{color:var(--fire)}
/* titres */
.hero{margin:6px 0 16px}.hero h1{font-size:30px}.hero p{color:var(--ink2);margin:6px 0 0;font-size:16px;line-height:1.45}
.jx{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}.jx small{font-size:17px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-left:6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.sec{font-size:20px;margin:24px 0 8px;display:flex;align-items:center;gap:8px}.cdot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.nb{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;margin:0 0 6px}.back{display:inline-flex;align-items:center;gap:1px;min-height:44px;color:var(--accent);font-weight:600;font-size:16px;margin-left:-8px;padding:6px 10px 6px 4px;border-radius:10px}.back .ic{width:22px;height:22px}
/* cartes */
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh),var(--hl)}
.card h2{font-size:22px;margin-bottom:8px}
.key{background:var(--tint);padding:12px 14px;margin:14px 0;border-radius:12px;line-height:var(--lh)}.key b{color:var(--accent2)}.key .eyebrow{color:var(--accent2)}
.tip{display:block;background:var(--card2);border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0;color:var(--ink);line-height:1.45}#app>.tip{background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:14px 16px}
/* lecture : 17 px minimum, interligne 1,5, 65 caractères, réglables dans le profil */
.lecture{font-family:var(--fl);font-size:var(--fs);line-height:var(--lh);max-width:var(--mw)}
.lecture p{margin:10px 0}.lecture .dl li,.lecture .dl>li>b,.lecture .enum li,.lecture .nl li{font-size:inherit;line-height:inherit}
.lecture h1{font-family:var(--fb);font-size:28px;margin:4px 0 6px}
aaa[data-n]{color:var(--accent2);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;border-radius:3px}
a[data-n]:hover{background:var(--tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.chip{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;background:var(--card2);color:var(--ink);border-radius:999px;padding:9px 13px;min-height:40px;text-align:left;line-height:1.25}.chip small{font-weight:500;color:var(--ink2);font-size:12.5px}.chip .cdot{width:8px;height:8px}
/* figures et laboratoires : toujours sur fond sombre, les schémas sont dessinés pour lui */
.fig{margin:12px 0;background:var(--fig);color:#E5E7EB;border-radius:12px;padding:10px;overflow-x:auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.18);--card:#0F172A;--card2:#1F2937;--ink:#E5E7EB;--ink2:#9CA3AF;--ink3:#6B7280;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--field:#0F172A;--muted:#9CA3AF;--gold:#FBBF24;--amber:#FBBF24;--amber2:#FCD34D;--tint:rgba(255,255,255,.08);font-family:var(--fb);font-size:15px}
.fig svg{display:block;width:100%;height:auto;max-height:230px}
.lab{display:grid;gap:12px}.lab label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}.lab label .mono{color:var(--ink);font-size:14px}
.lab input[type=range]{accent-color:var(--gold);width:100%}.lab select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.read div{background:var(--card2);border-radius:10px;padding:8px 10px}
.read small{display:block;font-size:11px;color:var(--ink2)}.read span{font-weight:600;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}.warn{color:var(--bad)!important;font-weight:600}
/* boutons */
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;background:var(--accent);color:var(--on);border-radius:14px;padding:13px 18px;font-size:16px;min-height:50px;line-height:1.2;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.22);background-image:linear-gradient(180deg,rgba(255,255,255,.12),transparent);transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .2s,opacity .2s}
.btn .ic{width:20px;height:20px}
.btn:active{transform:scale(.965);box-shadow:0 1px 2px rgba(0,0,0,.1)}.btn.ghost{background:var(--tint);color:var(--accent2);box-shadow:none;background-image:none}.btn.red{background:var(--badbg);color:var(--bad);box-shadow:none;background-image:none}.btn.wide{width:100%}.btn:disabled{opacity:.4}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14.5px;border-radius:11px;box-shadow:none;background-image:none}.btn.sm .ic{width:18px;height:18px}
.dots{display:flex;gap:6px;align-items:center}.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2);transition:width .2s}.dots i.on{background:var(--accent);width:18px}
/* questions */
.q{font-size:19px;font-weight:600;margin:4px 0 14px;line-height:1.4;letter-spacing:-.01em}
.opts{display:grid;gap:8px}.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.35;box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s,background .15s}
.opt:active:not(:disabled){transform:scale(.98);background:var(--card)}
.opt .k,.opt .n{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--card);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}.opt .n{color:var(--accent)}
.match .opt.paired{opacity:1;background:var(--tint);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}.ordact{display:flex;justify-content:space-between;gap:10px;margin-top:12px}.ordact .btn{flex:1}
.opt.sel{border-color:var(--accent);background:var(--tint);box-shadow:none}.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:none;animation:popok .4s}.opt.ok .k,.opt.ok .n{background:var(--ok);color:#fff;box-shadow:none}.opt.ko{border-color:var(--bad);background:var(--badbg);box-shadow:none;animation:shakeko .4s}.opt.ko .k{background:var(--bad);color:#fff;box-shadow:none}.opt.paired{opacity:.35}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match .opt{font-size:15px;padding:11px 12px}
.numin{display:flex;gap:8px;align-items:center}
.numin input,.field{font:600 18px var(--fb);background:var(--field);color:var(--ink);border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;min-width:0;font-variant-numeric:tabular-nums}.numin input{flex:1}.field{width:100%}.field.mono{font-family:ui-monospace,Menlo,monospace}.numin .u{color:var(--ink2);font-weight:600}
.fb{margin-top:14px;padding:14px;border-radius:14px;background:var(--badbg);font-size:var(--fs);line-height:var(--lh);animation:pop .25s}.fb.ok{background:var(--okbg)}
.fb>b{display:block;color:var(--bad);margin-bottom:4px}.fb.ok>b{color:var(--ok)}.fb b:empty{display:none}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}.frac>span{padding:1px 5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}.frac>span:first-child{border-bottom:1.5px solid currentColor}.sqrt{white-space:nowrap}.sqrt .rad{border-top:1.5px solid currentColor;padding:1px 2px 0 1px;margin-left:1px}sub,sup{font-size:.72em}.frac sup{position:relative;top:-.45em;line-height:0}.frac sub{position:relative;top:.3em;line-height:0}
.nl{margin:6px 0 10px;padding-left:1.6em}.nl li{margin:5px 0;padding-left:4px}.nl li::marker{color:var(--accent);font-weight:700}
.src{margin-top:10px;font-size:13px;color:var(--ink3)}.fbt{display:block;font-weight:700;color:var(--bad);margin-bottom:4px}.fbo{margin:0 0 10px 0;padding-left:22px}.fbo li{margin:5px 0;line-height:1.45}.fbo li::marker{color:var(--ink2);font-weight:700}.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:3px;line-height:1.4}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.res{text-align:center;padding:28px 16px 20px}.res .big{width:88px;height:88px;border-radius:28px;background:var(--tint);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin:0 auto 4px}.res .big .ic{width:44px;height:44px}.res h2{font-size:26px;margin:12px 0 4px}.res p{color:var(--ink2);margin:6px 0}
.res .gain{display:flex;justify-content:center;gap:8px;margin:14px 0;flex-wrap:wrap}
.miss{text-align:left;margin-top:16px}.miss>div:not(.eyebrow){background:var(--card2);border-radius:12px;padding:12px;margin:8px 0;font-size:15px;line-height:1.45}.miss b{display:block;margin-bottom:2px}
/* session de révision : une carte plein écran */
.sess{display:flex;flex-direction:column;min-height:calc(100dvh - 40px - var(--sat) - var(--sab))}
.sess .card{flex:1;display:flex;flex-direction:column;margin:8px 0}
.shead{display:flex;align-items:center;gap:12px;padding:4px 0}.shead .ebar{flex:1;height:6px}.shead .cnt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.trous .rt{font-size:15px;font-weight:600;color:var(--ink2);margin:0 0 14px}.trous .phrase{font-size:calc(var(--fs) + 2px);line-height:1.75;text-align:left;margin:0 0 12px}.trous .phrase b{font-weight:700}
.trou{display:inline-block;vertical-align:baseline;min-height:1.4em;line-height:1.3;margin:0 2px;padding:1px 7px;border-radius:7px 7px 3px 3px;background:var(--tint);box-shadow:inset 0 -2.5px 0 var(--accent);color:var(--accent2);font-weight:700;text-align:center}
.trou.vu{min-width:0!important;background:var(--okbg);box-shadow:inset 0 -2.5px 0 var(--ok);color:var(--ink);animation:pop .3s both}
.recto{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:16px 6px}.recto h2{font-size:26px;margin-bottom:10px}.recto .hint{color:var(--ink2);font-size:var(--fs)}
.verso{border-top:1px dashed var(--line2);margin-top:14px;padding-top:14px;animation:pop .25s}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:14px}
.grades button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);transition:transform .12s}
.grades button:active{transform:scale(.96)}.grades button small{font-weight:600;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.grades .g1{color:var(--bad)}.grades .g2{color:var(--gold)}.grades .g3{color:var(--ok)}.grades .g4{color:var(--accent2)}
.fast{font-size:13px;color:var(--ink2);margin-top:8px;text-align:center}
/* statistiques et profil */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh),var(--hl)}.stat small{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}.stat span{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:center;gap:6px}.stat span .ic{width:20px;height:20px;color:var(--gold)}
.stat.late span{color:var(--bad)}.stat.due span{color:var(--accent)}.stat.new span{color:var(--ok)}
.foot{margin-top:24px;text-align:center;font-size:13px;color:var(--ink2)}.foot button{color:var(--accent);font-weight:600;margin:0 6px;min-height:44px;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}.tbl th{text-align:left;font-size:12.5px;color:var(--ink2);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line2)}.tbl td{padding:8px 4px;border-bottom:1px solid var(--line)}.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap}
.gnote{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.gnote.ok{color:var(--ok)}.gnote.mid{color:var(--gold)}.gnote.ko{color:var(--bad)}
.verdict{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;margin:10px 0 0;font-size:15px;line-height:1.45}.verdict.ok{background:var(--okbg)}.verdict.ko{background:var(--badbg)}.verdict>.ic{width:20px;height:20px;flex:none;margin-top:1px}
/* navigation : barre en bas sur téléphone, barre latérale dès 900 px */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:flex-start;background:var(--card);background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab));z-index:5;box-shadow:0 -12px 30px rgba(20,20,30,.05)}
.tabbar .brand{display:none}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);min-width:60px;padding:4px 4px;border-radius:12px;transition:color .2s,transform .18s}.tabbar button.on{color:var(--accent)}.tabbar button b{display:block;width:26px;height:26px;line-height:0}.tabbar button b .ic{width:26px;height:26px}.tabbar button:active{transform:scale(.92)}
.tabbar .dot{position:absolute;top:2px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--card);box-sizing:content-box}
body.focus .tabbar{display:none}
@media(min-width:900px){
 .tabbar{top:0;right:auto;bottom:0;width:230px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + var(--sat)) 12px 18px;box-shadow:none}
 .tabbar .brand{display:block;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:4px 12px 16px}
 .tabbar button{flex-direction:row;gap:12px;width:100%;font-size:15.5px;min-height:44px;padding:8px 12px;color:var(--ink2)}.tabbar button b,.tabbar button b .ic{width:22px;height:22px}.tabbar button.on{background:var(--tint);color:var(--accent2)}
 .tabbar .dot{position:static;margin-left:auto;border:0}
 body.focus .tabbar{display:flex}
 body{padding-left:230px}
 #app{padding-bottom:40px}
}
/* listes */
.list button,.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:13px 14px;background:var(--card);border-radius:14px;margin:8px 0;box-shadow:var(--sh),var(--hl);font-size:16px;font-weight:500;line-height:1.35;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.list button:active,.lrow:active{transform:scale(.98)}

 try{if(typeof S==='object'&&S){S.err=(S.err||[]).concat([e]).slice(-20);localStorage.setItem('bq1',JSON.stringify(S))}}catch(_){}

  b.innerHTML='<div style="flex:1"></div><button aria-label="Fermer">OK</button>';b.firstChild.textContent='Un souci est survenu ('+e.v+(e.l?', ligne '+e.l:'')+') : '+e.m+'. L\'app continue, ta progression est gardée.';
  b.querySelector('button').onclick=()=>b.remove();clearTimeout(noteErreur.t);noteErreur.t=setTimeout(()=>{const x=document.getElementById('errbar');if(x)x.remove()},12000)}catch(_){}}

/* ===================== DATES ===================== */
/* Date locale, pas UTC : avant 2 h du matin en heure d'été, la journée ne doit pas compter pour la veille. */
const isoLocal=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>isoLocal(new Date());
/* dayN d'une date ISO (minuit UTC) : même convention que fsrs.js. */
const dayN=d=>Math.floor(new Date(d).getTime()/864e5);
const tN=()=>dayN(today());
const EXAMEN='2027-03-22';
const jx=()=>dayN(EXAMEN)-tN();

/* Clé unique bq1, S.v = 3 (cartes FSRS). Au démarrage : copie de sécurité de la v2, migration,
   import de Mesure Quest (mq2). Rien n'est jamais effacé : les champs inconnus sont gardés. */
const SKEY='bq1';
const DEF={v:3,xp:0,coins:0,done:{},sr:{},fr:{},streak:{last:'',n:0,best:0,ms:0},day:{d:'',n:0,ok:0,goal:false,nw:0},notif:{on:true,h:19,m:30},goal:20,nq:10,freeze:0,sfx:true,hap:true,hist:{},quests:{d:'',l:[]},lastOpen:'',rankSeen:'',
 notes:{},notesTs:{},log:[],ret:{},err:[],cas:true,conf:{sais:[0,0],hesite:[0,0],devine:[0,0]},lect:{t:17,lh:1.5,w:65,hc:false,f:'sys'},ts:0};
/* Fusion en profondeur : un sous-objet sauvegardé ne remplace jamais le défaut en bloc,
   sinon tout nouveau champ (lect.w, day.nw…) arriverait à undefined. */
const fusion=(def,sav)=>{if(!sav||typeof sav!=='object'||Array.isArray(sav))return sav===undefined?def:sav;const o=Object.assign({},def);for(const k in sav)o[k]=(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k]))?fusion(def[k],sav[k]):sav[k];return o};
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
/* Fusion de DEUX progressions réelles (iCloud, restauration d'une sauvegarde). Aucun rejet en bloc,
   aucun écrasement : on prend le meilleur de chaque élément, dans les deux sens. Perdre une carte
   coûte des semaines de révision, garder la mauvaise coûte une révision de trop. */
const nb=x=>{const v=+x;return isFinite(v)?v:0};
/* Une carte gagne si sa dernière révision est plus récente ; à égalité, la plus stable. */
const carteGagne=(x,y)=>{if(!x||typeof x!=='object')return y;if(!y||typeof y!=='object')return x;
 if(nb(x.last)!==nb(y.last))return nb(x.last)>nb(y.last)?x:y;
 return nb(y.s)>nb(x.s)?y:x};
/* Rappel libre : pas de champ « last », mais due - iv donne le jour de la dernière récitation. */
const frGagne=(x,y)=>{if(!x||typeof x!=='object')return y;if(!y||typeof y!=='object')return x;
 const vx=nb(x.due)-nb(x.iv),vy=nb(y.due)-nb(y.iv);if(vx!==vy)return vx>vy?x:y;
 return nb(y.n)>nb(x.n)?y:x};
/* Union de deux dictionnaires : la clé absente d'un côté est reprise telle quelle. */
const unir=(a,b,gagne)=>{const o=Object.assign({},a||{});for(const k in (b||{}))o[k]=(k in o)?gagne(o[k],b[k],k):b[k];return o};
const maxChamps=(x,y)=>{if(typeof x!=='object'||!x)return y;if(typeof y!=='object'||!y)return x;
 const o=Object.assign({},x);for(const k in y)o[k]=(typeof x[k]==='number'&&typeof y[k]==='number')?Math.max(x[k],y[k]):(k in x?o[k]:y[k]);return o};
/* Journée d'historique : le plus grand compte gagne ; un gel ne remplace jamais un nombre. */
const histGagne=(x,y)=>{if(typeof x==='number'&&typeof y==='number')return Math.max(x,y);
 if(typeof x==='number')return x;if(typeof y==='number')return y;return x===undefined?y:x};
const listeUnie=(a,b,cle,n)=>{const vus={},o=[];(a||[]).concat(b||[]).forEach(e=>{const k=cle(e);if(vus[k])return;vus[k]=1;o.push(e)});
 return o.sort((x,y)=>cle(x)<cle(y)?-1:1).slice(-n)};
/* a : l'état local. b : l'état reçu. Les réglages simples suivent l'état le plus récemment enregistré. */
function fusionEtat(a,b){
 if(!b||typeof b!=='object')return a;if(!a||typeof a!=='object')return b;
 const recent=nb(b.ts)>=nb(a.ts)?b:a,vieux=recent===b?a:b;
 const o=Object.assign({},vieux,recent);
 o.sr=unir(a.sr,b.sr,carteGagne);
 o.fr=unir(a.fr,b.fr,frGagne);

 o.ret=unir(a.ret,b.ret,(x,y)=>[Math.max(nb(x&&x[0]),nb(y&&y[0])),Math.max(nb(x&&x[1]),nb(y&&y[1]))]);
 /* Notes personnelles : le texte le plus récent d'après notesTs ; sans horodatage, le plus long,
    parce qu'une note s'allonge au fil des révisions et qu'on ne veut jamais raboter du texte écrit. */
 const ta=a.notesTs||{},tb=b.notesTs||{};
 o.notes=unir(a.notes,b.notes,(x,y,k)=>{const da=nb(ta[k]),db=nb(tb[k]);
  if(da!==db)return da>db?x:y;return String(y||'').length>String(x||'').length?y:x});
 o.notesTs=unir(ta,tb,(x,y)=>Math.max(nb(x),nb(y)));
 o.xp=Math.max(nb(a.xp),nb(b.xp));o.coins=Math.max(nb(a.coins),nb(b.coins));o.freeze=Math.max(nb(a.freeze),nb(b.freeze));

   pondéré par la chance de s'en souvenir aujourd'hui : une note laissée de côté pâlit, une révision la rallume.

const EPRDE={};for(let li=1;li<=NCH;li++)EPRDE[li]=EPR.map((e,i)=>e.l.includes(li)?i:-1).filter(i=>i>=0);
const POIDS=EPR.map(e=>(parseFloat(String(e.p).replace(',','.'))||25)/100);
/* Rétention visée : 0,85 pour les cartes de l'épreuve 4 seule (elle porte la moitié des cartes
   pour 20 % de la note), 0,9 ailleurs. Des intervalles un peu plus longs y libèrent du temps. */
const retDe=id=>{const x=ITEM[id],e=x&&EPRDE[x.li];return e&&e.length===1&&e[0]===3?.85:.9};
/* Cartes jamais vues d'un chapitre : tous les points clés, puis les questions. */
const neuvesChap=li=>L[li].b.flatMap(b=>KBYNOTE[b.id]||[]).concat(L[li].b.flatMap(b=>QBYNOTE[b.id]||[])).filter(x=>!S.sr[x.id]).map(x=>x.id);
/* Nouvelles du jour, tirées selon le poids des épreuves : chaque carte va au chapitre dont une épreuve
   est la plus en retard sur son poids (un chapitre partagé compte pour chacune). Trois chapitres au plus
   par jour, entrelacés ; à égalité, un chapitre commencé passe avant, puis l'ordre du cours. */
const MAXCH=3;
function nouvelles(n){const o=[];if(n<=0)return o;const cand=[];
 for(let li=1;li<=NCH;li++){const l=neuvesChap(li);if(l.length)cand.push({li,l,p:0,vu:chapVu(li)?1:0})}
 cand.sort((a,b)=>(b.vu-a.vu)||(a.li-b.li));
 /* le retard de chaque épreuve se mesure sur toutes les cartes déjà vues, pas sur la seule journée :
    sinon l'épreuve 1 gagnait chaque matin et l'épreuve 2 n'arrivait jamais */
 const c=EPR.map(()=>0),pris=[];let tot=0;for(const id in S.sr){const x=ITEM[id];if(!x)continue;tot++;(EPRDE[x.li]||[]).forEach(i=>c[i]++)}
 const manque=x=>EPRDE[x.li].length?Math.max(...EPRDE[x.li].map(i=>POIDS[i]-(tot?c[i]/tot:0))):-1;
 const meilleur=l=>l.reduce((a,b)=>manque(b)>manque(a)+1e-9?b:a);
 while(o.length<n){let src=pris.filter(x=>x.p<x.l.length);
  if(pris.length<MAXCH){const nv=cand.filter(x=>!pris.includes(x));if(nv.length)src=src.concat([meilleur(nv)])}
  if(!src.length)break;const x=meilleur(src);if(!pris.includes(x))pris.push(x);
  o.push(x.l[x.p++]);tot++;EPRDE[x.li].forEach(i=>c[i]++)}
 return o}
function fileDuJour(){const t=tN(),d=dues();const retard=d.filter(id=>S.sr[id].due<t),auj=d.filter(id=>S.sr[id].due>=t);const nv=nouvelles(quotaNouv());return{retard,auj,nv}}

const KELLY=['#F3C300','#875692','#F38400','#A1CAF1','#BE0032','#C2B280','#848482','#008856','#E68FAC','#0067A5','#F99379','#604E97','#F6A600','#B3446C','#DCD300','#882D17','#8DB600','#654522'];
const couleurCours=id=>{const i=Math.max(0,COURS.findIndex(c=>c.id===id));return KELLY[i%KELLY.length]};
const fmtKey=k=>{const h=fx(lk(k));return fmtList(h,(l,ol)=>(l?l+' ':'')+ol)||fmtDefs(h)||fmtEnum(h)||h};
/* Une note de plus de 1 200 caractères s'affiche en deux pages : une idée par écran. */
function notePages(b){const p=b.p||[];const lens=p.map(x=>plain(x).length),tot=lens.reduce((a,x)=>a+x,0)+plain(b.k).length;
 if(tot<=1200||p.length<2)return [p];let cum=0,cut=1;for(let i=0;i<p.length-1;i++){cum+=lens[i];cut=i+1;if(cum>=tot/2-plain(b.k).length/2)break}
 return [p.slice(0,cut),p.slice(cut)]}
function corpsNote(b,page){const pages=notePages(b),P=pages.length,pg=Math.max(0,Math.min(page||0,P-1)),c=coursOf(b.li);
 let h=`<div class="notepage lecture"><div class="meta"><span><i class="cdot" style="background:${couleurCours(c.id)}"></i> ${esc(c.id)} · ${esc(c.t)}</span><span>ch. ${b.li} · ${esc(L[b.li].t)}</span></div><h1>${b.h}</h1>${b.src?`<div class="src" style="margin-top:0">Source : ${b.src}</div>`:''}${tagAide(b.li)}`;
 if(pg===0){if(b.k)h+=`<div class="key"><div class="eyebrow">Points clés</div>${fmtKey(b.k)}</div>`;if(b.fig)h+=`<div class="fig">${b.fig}</div>`}
 h+=pages[pg].map(p=>para(lk(p))).join('');
 if(pg===P-1&&b.lab&&LAB[b.lab])h+=`<div class="fig"><div class="eyebrow">Laboratoire · touche les curseurs</div><div class="lab" data-lab>${''}</div><div data-labout style="margin-top:12px"></div></div>`;
 if(P>1)h+=`<div class="nav"><button class="btn ghost sm" data-pg="${pg-1}" ${pg?'':'disabled'}>${ic('chevL')}Début</button><span class="eyebrow" style="margin:0">Page ${pg+1} / ${P}</span><button class="btn sm${pg<P-1?'':' ghost'}" data-pg="${pg+1}" ${pg<P-1?'':'disabled'}>Suite${ic('chevR')}</button></div>`;
 return h+'</div>'}

 /* examen chronométré : o.min minutes pour toute la liste, les questions non faites comptent fausses */
 const N0=list.length,T0=Date.now(),FIN=o.min?T0+o.min*6e4:0;let chrono=0;
 const restant=()=>{const s=Math.max(0,Math.ceil((FIN-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ===================== ÉPREUVES ET EXAMENS BLANCS ===================== */
/* Part vue, part ancrée (stabilité ≥ 21 j), points fragiles : questions et cartes de l'épreuve. */
function eprCartes(i){return EPR[i].l.flatMap(li=>cartesChap(li))}
function eprStat(i){const cs=eprCartes(i);let seen=0,mast=0,frag=0;cs.forEach(x=>{const r=S.sr[x.id];if(r){seen++;const e=etat(r);if(e==='anc')mast++;if(e==='frag')frag++}});const tot=cs.length||1;return{tot:cs.length,nseen:seen,nmast:mast,seen:Math.round(seen/tot*100),mast:Math.round(mast/tot*100),frag}}
/* Points faibles d'abord : jamais vues, fragiles, ou moins de deux réussites de suite. */
const weakFirst=pool=>{const f=x=>{const r=S.sr[x.id];return !r||r.f>0||r.n<2};return shuffle(pool.filter(f)).concat(shuffle(pool.filter(x=>!f(x))))};
/* Format réel, proportionnel à la durée de l'épreuve : questions, minutes, support autorisé.
   Épreuve 1 : les chapitres de l'épreuve 1 (domaines A, C, D, E, F du profil de qualification). */
const FMT=[{n:30,m:45},{n:15,m:20,s:'fascicule autorisé'},{n:20,m:30,s:'classeur autorisé'},{n:20,m:25}];
/* Tirage mélangé : une question par chapitre à tour de rôle, chapitres dans le désordre, puis tout mélangé. */
function tirage(lis,n){const g=shuffle(lis).map(li=>shuffle(L[li].q.map(q=>ITEM[q.id]).filter(Boolean)));const o=[];
 while(o.length<n&&g.some(a=>a.length))g.forEach(a=>{if(a.length&&o.length<n)o.push(a.pop())});return shuffle(o)}
function examenBlanc(i){let pool,titre;const o={examen:true,epr:i==null?-1:i};
 if(i==null||i<0){pool=ALLQ.filter(x=>S.sr[x.id]);if(pool.length<15)pool=ALLQ;pool=shuffle(pool).slice(0,15);titre='Examen blanc'}
 else{const f=FMT[i]||{n:20,m:30};pool=tirage(EPR[i].l,f.n);titre='Examen blanc · '+EPR[i].n;o.min=f.m;o.support=f.s||'sans support'}
 reviser(pool.map(x=>x.id),Object.assign(o,{titre}))}

/* ===================== RAPPEL LIBRE ===================== */
/* On dit ce qu'on sait AVANT de relire. La recherche en mémoire sans indice ancre plus
   profondément que la reconnaissance. Clés S.fr « chapitre.index », hors FSRS. */
function frDue(){const t=tN(),o=[];for(let li=1;li<=NCH;li++){if(!chapVu(li))continue;L[li].b.forEach((b,idx)=>{const r=S.fr[li+'.'+idx];if(!r||r.due<=t)o.push({li,idx,r})})}return shuffle(o.filter(x=>!x.r)).concat(o.filter(x=>x.r).sort((a,b)=>a.r.due-b.r.due))}

  <div class="tip"><b>Ferme les yeux et réponds à la consigne</b>, à voix haute ou sur un papier. Trente secondes. Ensuite seulement, révèle et coche ce que tu as dit.</div>

 const cv=$('#gcv'),ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);let W=0,H=0;

 const REP=900,LEN=46,KS=.035,GRAV=.012;

  ctx.lineWidth=1/V.s;ctx.strokeStyle=dark?'rgba(255,255,255,.14)':'rgba(60,60,67,.16)';ctx.beginPath();for(const [i,j] of edges){const a=nodes[i],b=nodes[j];ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}ctx.stroke();
  if(hover>=0){ctx.strokeStyle=nodes[hover].c;ctx.lineWidth=2/V.s;ctx.beginPath();for(const [i,j] of edges)if(i===hover||j===hover){ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y)}ctx.stroke()}

  const fsz=12/V.s;ctx.font=`600 ${fsz}px -apple-system,system-ui,sans-serif`;ctx.textAlign='center';ctx.lineJoin='round';
  const boites=[],ordre=nodes.map((n,i)=>i).sort((a,b)=>(b===hover)-(a===hover)||nodes[b].deg-nodes[a].deg);for(const i of ordre){const n=nodes[i];if(!(i===hover||n.deg>=10||(V.s>1.3&&n.deg>=5)||V.s>2.2))continue;const t=plain(n.b.h),s=t.length>34?t.slice(0,33)+'…':t;const w=ctx.measureText(s).width,bx=[n.x-w/2,n.y-n.r-4/V.s-fsz,w,fsz*1.2];if(i!==hover&&boites.some(q=>bx[0]<q[0]+q[2]&&q[0]<bx[0]+bx[2]&&bx[1]<q[1]+q[3]&&q[1]<bx[1]+bx[3]))continue;boites.push(bx);ctx.lineWidth=3/V.s;ctx.strokeStyle=bg;ctx.strokeText(s,n.x,n.y-n.r-4/V.s);ctx.fillStyle=i===hover?ink:ink2;ctx.fillText(s,n.x,n.y-n.r-4/V.s)}

 for(let k=0;k<80;k++)pas();fit();fitDone=true;
 const boucle=()=>{if(!GR)return;const m=pas();if(tick<200&&!drag&&tick%20===0&&!GR.touche)fit();dessin();if((m<.05&&tick>60)||alpha<.02){GR.raf=0;dessin();return}GR.raf=requestAnimationFrame(boucle)};

 /* Interactions : un doigt ou la souris déplace la vue (ou un nœud), deux doigts zooment, un toucher bref ouvre la note. */
 const monde=(px,py)=>[(px-V.tx)/V.s,(py-V.ty)/V.s];
 const cible=(px,py)=>{const [x,y]=monde(px,py);let best=-1,bd=1e9;nodes.forEach((n,i)=>{const d=Math.hypot(n.x-x,n.y-y);if(d<n.r+10/V.s&&d<bd){bd=d;best=i}});return best};

  const t=cible(p[0],p[1]);drag=t>=0?{n:t}:{pan:[V.tx,V.ty]};if(t>=0){nodes[t].fix=true}};

/* ===================== CERVEAU 3D ===================== */
/* Le graphe des notions en relief : un cerveau à deux hémisphères, la gestion (AA) à gauche, la technique (AE)
   à droite. Chaque cours est une région posée sur la surface d'un ellipsoïde, ses notes se groupent autour de son
   centre, les liens entre cours tendent des fibres à travers le volume. three.js (sous-ensemble local) n'est
   chargé qu'à l'ouverture. Sans WebGL, ou si le chargement échoue, le graphe 2D reprend la main. */
let G3=null,T3=null;
function webglOk(){try{const c=document.createElement('canvas'),g=c.getContext('webgl2')||c.getContext('webgl');if(!g)return false;const x=g.getExtension('WEBGL_lose_context');if(x)x.loseContext();return true}catch(e){return false}}
function cvGraphe(){if(!webglOk()){cvGraphe2D();return}cerveau3D()}
function stop3D(){if(!G3)return;const g=G3;G3=null;try{if(g.off)g.off()}catch(e){console.warn('Cerveau 3D, arrêt',e)}const l=$('#c3d');if(l)l.remove();document.body.classList.remove('c3on')}

function statistiques(){const t=tN(),all=TOUS(),E=compteEtats(all),N=all.length;
 /* rétention observée : cartes déjà vues, notées sur les 30 derniers jours */
 let rok=0,rtot=0;for(const k in S.ret){if(t-dayN(k)<30){rok+=S.ret[k][0];rtot+=S.ret[k][1]}}
 /* charge : cartes dues par jour sur 14 jours (le retard compte aujourd'hui), puis par semaine jusqu'à l'examen */

 for(const id in S.sr){if(!ITEM[id])continue;const d=Math.max(0,S.sr[id].due-t);if(d<14)j14[d]++;else{const w=Math.floor((d-14)/7);if(w<sem.length)sem[w]++}}
 const jl=j14.map((_,i)=>{const dd=new Date(Date.now()+i*864e5);return i===0?'auj.':i%2===0?String(dd.getDate()):''});
 const sl=sem.map((_,i)=>{const dd=new Date(Date.now()+(14+i*7)*864e5);return i%3===0?dd.getDate()+'.'+String(dd.getMonth()+1).padStart(2,'0'):''});
 const notes=EPR.map((e,i)=>noteEpreuve(i)),moy=Math.round(notes.reduce((a,n,i)=>a+n*poids(i),0)/EPR.reduce((a,_,i)=>a+poids(i),0)*10)/10;
 const sous4=notes.filter(n=>n<4).length,sous3=notes.filter(n=>n<3).length,reussi=moy>=4&&sous4<=1&&!sous3;
 const log=(S.log||[]).slice(-15).reverse();
 app.innerHTML=hud()+`<div class="hero"><h1>Statistiques</h1><p>Où tu en es, ce qui t'attend, et une note estimée par épreuve. J-${Math.max(0,jx())} avant l'examen du 22 mars 2027.</p></div>
 <div class="grid2"><div class="stat"><small>Rétention observée · 30 jours</small><span>${rtot?Math.round(rok/rtot*100)+' %':'pas encore'}</span></div><div class="stat"><small>Révisions notées · 30 jours</small><span>${rtot}</span></div></div>

 <div style="overflow-x:auto;margin-top:12px"><table class="tbl"><thead><tr><th>Épreuve</th><th class="r">Nouv.</th><th class="r">En cours</th><th class="r">Ancrées</th><th class="r">Fragiles</th></tr></thead><tbody>${EPR.map((e,i)=>{const c=compteEtats(eprCartes(i));return `<tr><td style="white-space:nowrap">${e.n} <small style="color:var(--ink2)">${e.p}</small></td><td class="r">${c.new}</td><td class="r">${c.cours}</td><td class="r" style="color:var(--ok)">${c.anc}</td><td class="r" style="color:var(--bad)">${c.frag}</td></tr>`}).join('')}</tbody></table></div>

 <div class="card"><div class="eyebrow">Note estimée par épreuve, sur 6</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Épreuve</th><th class="r">Poids</th><th class="r">Note</th></tr></thead><tbody>${EPR.map((e,i)=>`<tr><td><b>${e.n}</b> · ${esc(e.t)}</td><td class="r">${e.p}</td><td class="r"><span class="gnote ${clsNote(notes[i])}">${fmt1(notes[i])}</span></td></tr>`).join('')}<tr><td><b>Moyenne pondérée</b></td><td></td><td class="r"><span class="gnote ${clsNote(moy)}">${fmt1(moy)}</span></td></tr></tbody></table></div>
 <div class="verdict ${reussi?'ok':'ko'}">${ic(reussi?'check':'alert')}<div><b>${reussi?'Au rythme actuel, les conditions de réussite sont remplies.':'Pas encore dans les conditions de réussite.'}</b> Règle : moyenne d'au moins 4,0, au plus une épreuve sous 4,0, aucune sous 3,0.${!reussi?' Ici : moyenne '+fmt1(moy)+(sous4>1?', '+sous4+' épreuves sous 4,0':'')+(sous3?', '+pl(sous3,'épreuve')+' sous 3,0':'')+'.':''}</div></div>
 <p class="eyebrow" style="margin-top:8px">Calcul : 1 + 5 × la probabilité moyenne de retrouver chaque carte de l'épreuve aujourd'hui (FSRS), une carte jamais vue comptant zéro. 60 % de rappel donne 4,0. Indicateur de préparation, pas une prédiction : l'oral et la pratique ne sont pas mesurés.</p></div>

 return `<div class="card" id="repart"><div class="eyebrow">Cartes vues par épreuve, face au poids de l'examen</div>${EPR.map((e,i)=>{const p=sv?Math.round(v[i]/sv*100):0,c=Math.round(POIDS[i]*100);return `<div class="rep"><div class="rep-l"><span><b>${e.n}</b> · ${pl(v[i],'carte vue','cartes vues')}</span><span>${p} %<small>cible ${c} %</small></span></div><div class="rep-b" role="img" aria-label="${e.n} : ${p} % des cartes vues, cible ${c} %"><i style="width:${p}%"></i><em style="left:${c}%"></em></div></div>`}).join('')}<p class="eyebrow" style="margin-top:8px">Le trait marque la cible. Les nouvelles cartes du jour sont tirées pour s'en rapprocher.</p></div>`}
/* Confiance déclarée avant la réponse : la surconfiance est la part de « Je sais » ratés. */
function confiance(){const c=S.conf||{},z=[['Je sais',c.sais||[0,0]],['J\'hésite',c.hesite||[0,0]],['Je devine',c.devine||[0,0]]],s=z[0][1];
 return `<div class="card"><div class="eyebrow">Confiance avant la réponse</div><div class="grid2"><div class="stat"><small>Surconfiance · « Je sais » ratés</small><span id="surconf" class="${s[0]&&(s[0]-s[1])/s[0]>.1?'warn':''}">${s[0]?Math.round((s[0]-s[1])/s[0]*100)+' %':'pas encore'}</span></div><div class="stat"><small>Réponses avec confiance</small><span>${z.reduce((a,x)=>a+x[1][0],0)}</span></div></div><div style="overflow-x:auto;margin-top:10px"><table class="tbl"><thead><tr><th>Niveau</th><th class="r">Réponses</th><th class="r">Justes</th></tr></thead><tbody>${z.map(([n,x])=>`<tr><td>${n}</td><td class="r">${x[0]}</td><td class="r">${x[0]?Math.round(x[1]/x[0]*100)+' %':''}</td></tr>`).join('')}</tbody></table></div><p class="eyebrow" style="margin-top:8px">Au dessus de 10 % de « Je sais » ratés, tu te crois plus prêt que tu ne l'es.</p></div>`}

 $('#lreset').onclick=()=>{S.lect=Object.assign({},DEF.lect);appliquerLecture();maj()};
 app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;maj()});
 app.querySelectorAll('[data-nq]').forEach(b=>b.onclick=()=>{S.nq=+b.dataset.nq;maj()});
 $('#cas').onchange=e=>{S.cas=e.target.checked;save();toast(S.cas?'Études de cas activées':'Études de cas masquées')};
 $('#sfx').onchange=e=>{S.sfx=e.target.checked;save();if(S.sfx)SFX.ok()};$('#hapt').onchange=e=>{S.hap=e.target.checked;save();hap('ok')};
 $('#buyfrz').onclick=()=>{if(S.coins<50||(S.freeze||0)>=2)return;S.coins-=50;S.freeze=(S.freeze||0)+1;SFX.coin();toast('Gel acheté. Tu en as '+S.freeze+'.');maj()};
 if(BRIDGE){pushRappels();const fb=$('#nfb');const mr=()=>{save();pushRappels();fb.textContent=S.notif.on?'Rappel réglé à '+String(S.notif.h).padStart(2,'0')+' h '+String(S.notif.m).padStart(2,'0')+'.':'Rappels désactivés.'};
  $('#non').onchange=e=>{S.notif.on=e.target.checked;mr()};$('#nheure').onchange=e=>{const v=(e.target.value||'19:30').split(':');S.notif.h=+v[0];S.notif.m=+v[1];mr()}}
 $('#exp').onclick=()=>{const txt=JSON.stringify(Object.assign({jeu:SKEY,exp:Date.now()},S));if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
  let ta=$('#expta');if(!ta){ta=document.createElement('textarea');ta.id='expta';ta.readOnly=true;ta.setAttribute('aria-label','Sauvegarde exportée');ta.style.cssText='width:100%;height:110px;margin-top:8px;font:12px ui-monospace,Menlo,monospace;background:var(--field);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px';$('#exp').parentNode.after(ta)}ta.value=txt;ta.focus();ta.select();
  toast(ic('check')+'Sauvegarde copiée. Colle la dans une note.')};
 /* Import : une sauvegarde Brevet Quest (v2 ou v3) remplace la progression ; une sauvegarde de
    Mesure Quest (jeu mq2) est fusionnée, sans rien écraser. */
 $('#imp').onclick=()=>{const v=prompt('Colle ta sauvegarde :');if(!v)return;let o;try{o=JSON.parse(v)}catch(e){alert('Sauvegarde illisible.');return}
  if(!o||typeof o!=='object'||!o.sr){alert('Ce texte n\'est pas une sauvegarde.');return}
  if(o.jeu==='mq2'){if(!confirm('Fusionner cette sauvegarde de Mesure Quest avec ta progression ?'))return;delete o.jeu;delete o.exp;const m=S.mesureImporte;S.mesureImporte=false;S=fusion(DEF,Migration.fusionnerMesure(S,o));if(m&&!S.mesureImporte)S.mesureImporte=true;save();location.reload();return}
  if(o.jeu&&o.jeu!==SKEY){alert('Cette sauvegarde ne vient pas de Brevet Quest.');return}
  if(!confirm('Remplacer ta progression actuelle par cette sauvegarde ? Une copie de l\'actuelle est gardée sur l\'appareil.'))return;
  try{localStorage.setItem('bq1.avant-import',JSON.stringify(S))}catch(e){}delete o.jeu;delete o.exp;S=fusion(DEF,Migration.migrerV3(o));S.v=3;save();location.reload()};
 $('#reset').onclick=()=>{if(!confirm('Tout effacer ? XP, série, mémoire des cartes, notes personnelles. Une copie est gardée sur l\'appareil.'))return;try{localStorage.setItem('bq1.avant-reinit',JSON.stringify(S));localStorage.removeItem(SKEY)}catch(e){}location.reload()};
 const ec=$('#errclr');if(ec)ec.onclick=()=>{S.err=[];save({ts:false});profil()};
 if(CLOUD){brancherSauv();listerSauvegardes()}
 flushCele()}

/* Liste des copies datées, et bouton Restaurer. Tant que l'app n'a pas répondu, on l'annonce. */
function sauvHtml(){if(SAUVES===null)return '<p class="eyebrow">Lecture des sauvegardes…</p>';
 if(!SAUVES.length)return '<p class="eyebrow">Aucune copie pour l\'instant. La première est écrite à ta prochaine réponse.</p>';
 return SAUVES.slice().reverse().map(x=>{const n=typeof x==='string'?x:(x&&x.nom)||'',j=/(\d{4})-(\d{2})-(\d{2})/.exec(n),
  d=j?new Date(+j[1],+j[2]-1,+j[3]).toLocaleDateString('fr-CH',{weekday:'short',day:'numeric',month:'long'}):n,
  ko=typeof x==='object'&&x&&x.taille?' · '+Math.round(x.taille/1024)+' ko':'';
  return `<div class="row"><span>${esc(d)}<br><small style="color:var(--ink2)">${esc(n)}${ko}</small></span><button class="btn ghost sm" data-sauv="${esc(n)}">Restaurer</button></div>`}).join('')}
function brancherSauv(){app.querySelectorAll('[data-sauv]').forEach(b=>b.onclick=()=>{const n=b.dataset.sauv;
 if(!confirm('Restaurer la sauvegarde du '+n+' ? Elle sera fusionnée avec ta progression actuelle, rien ne sera effacé.'))return;
 b.disabled=true;b.textContent='…';try{CLOUD.postMessage({restaurer:n})}catch(e){b.disabled=false;b.textContent='Restaurer'}})}


/* ===================== DÉMARRAGE ===================== */
charger();appliquerLecture();newDay();demanderCloud();
/* L'état iCloud poussé par l'app avant que le moteur existe est rejoué ici. */
if(window.__cloudEnAttente){const t=window.__cloudEnAttente;window.__cloudEnAttente=null;window.recevoirCloud(t)}
bienvenue();go('auj');pushRappels();
if(MIGRATION)toast(ic('check')+'Progression migrée : '+MIGRATION.apres+' cartes conservées'+(MIGRATION.mesure?', dont '+MIGRATION.mesure+' de Mesure Quest':''));
if('serviceWorker' in navigator&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.MOTEUR_OK=true;
</script>
